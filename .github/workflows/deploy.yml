name: Check and deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  # A newer push supersedes an in-flight one. Two deploys racing to the same
  # Worker is how a build from ten minutes ago wins.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck per package: `turbo run typecheck` fails because @ownlane/ui
      # lists itself as a devDependency.
      - run: pnpm --filter @ownlane/ui typecheck
      - run: pnpm --filter dashboard typecheck
      - run: pnpm format:check
      - run: pnpm --filter dashboard build

  deploy:
    # Only after checks pass, and never from a pull request — a fork must not be
    # able to reach these secrets.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The environment is selected at build time: the vite plugin flattens
      # wrangler.jsonc into build/server/wrangler.json and drops `env` blocks,
      # so `wrangler deploy --env` alone would ship the development config.
      - name: Build for ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: pnpm --filter dashboard build
        env:
          CLOUDFLARE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      # Migrations run before the Worker that depends on them. A deploy whose
      # code expects a table that does not exist yet fails at request time,
      # which is worse than failing here.
      - name: Apply migrations
        run: pnpm --filter dashboard exec wrangler d1 migrations apply ${{ vars.D1_DATABASE_NAME }} --env ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: pnpm --filter dashboard exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
